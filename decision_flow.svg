<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3D3870"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F77DD"/>
    </marker>
  </defs>

  <rect width="1800" height="1000" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="900" y="62" text-anchor="middle" font-size="40" font-weight="bold" fill="#2E2A55">Post-Training Decision Architecture</text>
  <text x="900" y="102" text-anchor="middle" font-size="24" font-style="italic" fill="#5B54A6">Four diagnostics, run in sequence — the verdict is whichever gate fires first</text>
  <line x1="470" y1="122" x2="1330" y2="122" stroke="#3D3870" stroke-width="3"/>
  <circle cx="470" cy="122" r="6" fill="#3D3870"/><circle cx="1330" cy="122" r="6" fill="#3D3870"/>

  <!-- Entry -->
  <rect x="60" y="170" width="250" height="78" rx="14" fill="#3D3870"/>
  <text x="185" y="206" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">NEW BATCH</text>
  <text x="185" y="233" text-anchor="middle" font-size="18" fill="#D9D5F5">scored by frozen models</text>
  <line x1="310" y1="209" x2="372" y2="209" stroke="#3D3870" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- STEP 1 -->
  <rect x="380" y="150" width="310" height="240" rx="16" fill="#FFFFFF" stroke="#C9C3EE" stroke-width="2"/>
  <rect x="380" y="150" width="310" height="52" rx="16" fill="#3D3870"/>
  <rect x="380" y="186" width="310" height="16" fill="#3D3870"/>
  <circle cx="412" cy="176" r="17" fill="#FFFFFF"/>
  <text x="412" y="183" text-anchor="middle" font-size="20" font-weight="bold" fill="#3D3870">1</text>
  <text x="442" y="183" font-size="20" font-weight="bold" fill="#FFFFFF">POPULATION STABILITY</text>
  <text x="404" y="238" font-size="19" fill="#2E2A55">Covariates only — available</text>
  <text x="404" y="264" font-size="19" fill="#2E2A55">the moment data arrives.</text>
  <text x="404" y="300" font-size="19" fill="#2E2A55">PSI per feature, read against</text>
  <text x="404" y="326" font-size="19" fill="#2E2A55">each model's tolerance limit:</text>
  <text x="404" y="352" font-size="19" font-weight="bold" fill="#5B54A6">an early warning, not a verdict.</text>
  <line x1="690" y1="270" x2="752" y2="270" stroke="#3D3870" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- STEP 2 -->
  <rect x="760" y="150" width="310" height="240" rx="16" fill="#FFFFFF" stroke="#C9C3EE" stroke-width="2"/>
  <rect x="760" y="150" width="310" height="52" rx="16" fill="#3D3870"/>
  <rect x="760" y="186" width="310" height="16" fill="#3D3870"/>
  <circle cx="792" cy="176" r="17" fill="#FFFFFF"/>
  <text x="792" y="183" text-anchor="middle" font-size="20" font-weight="bold" fill="#3D3870">2</text>
  <text x="822" y="183" font-size="19" font-weight="bold" fill="#FFFFFF">PERFORMANCE MOVED?</text>
  <text x="784" y="238" font-size="19" fill="#2E2A55">Once outcomes are observed.</text>
  <text x="784" y="274" font-size="19" fill="#2E2A55">AUC loss &gt; 0.02, or</text>
  <text x="784" y="300" font-size="19" fill="#2E2A55">Brier rise &gt; 0.02</text>
  <text x="784" y="336" font-size="18" font-style="italic" fill="#5B54A6">vs. the golden-test-set baseline</text>
  <line x1="1070" y1="270" x2="1132" y2="270" stroke="#3D3870" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1101" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#3D3870">yes</text>

  <!-- STEP 2 no branch -->
  <line x1="915" y1="390" x2="915" y2="470" stroke="#7F77DD" stroke-width="4" marker-end="url(#arrowlight)"/>
  <text x="935" y="435" font-size="18" font-weight="bold" fill="#5B54A6">no</text>
  <rect x="760" y="478" width="310" height="70" rx="14" fill="#E8E5FA" stroke="#B5AFEB" stroke-width="2"/>
  <text x="915" y="512" text-anchor="middle" font-size="22" font-weight="bold" fill="#3D3870">NO ACTION</text>
  <text x="915" y="536" text-anchor="middle" font-size="17" fill="#5B54A6">nothing to correct; keep monitoring</text>

  <!-- STEP 3 -->
  <rect x="1140" y="150" width="310" height="240" rx="16" fill="#FFFFFF" stroke="#C9C3EE" stroke-width="2"/>
  <rect x="1140" y="150" width="310" height="52" rx="16" fill="#3D3870"/>
  <rect x="1140" y="186" width="310" height="16" fill="#3D3870"/>
  <circle cx="1172" cy="176" r="17" fill="#FFFFFF"/>
  <text x="1172" y="183" text-anchor="middle" font-size="20" font-weight="bold" fill="#3D3870">3</text>
  <text x="1202" y="183" font-size="20" font-weight="bold" fill="#FFFFFF">STRUCTURAL CHECK</text>
  <text x="1164" y="238" font-size="19" fill="#2E2A55">SHAP rank stability (ρ &lt; 0.85)</text>
  <text x="1164" y="264" font-size="19" fill="#2E2A55">prompts the check; it does not</text>
  <text x="1164" y="290" font-size="19" fill="#2E2A55">decide.</text>
  <text x="1164" y="326" font-size="19" fill="#2E2A55">Unscorable rows, or a batch</text>
  <text x="1164" y="352" font-size="19" fill="#2E2A55">in barely-seen categories?</text>

  <!-- STEP 3 -> Rebuild -->
  <line x1="1450" y1="270" x2="1512" y2="270" stroke="#3D3870" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1481" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#3D3870">yes</text>
  <rect x="1520" y="222" width="230" height="96" rx="14" fill="#3D3870"/>
  <text x="1635" y="262" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">REBUILD</text>
  <text x="1635" y="290" text-anchor="middle" font-size="17" fill="#D9D5F5">change the feature set</text>
  <text x="1635" y="310" text-anchor="middle" font-size="17" fill="#D9D5F5">or encoding, then refit</text>

  <!-- STEP 3 -> STEP 4 -->
  <line x1="1295" y1="390" x2="1295" y2="560" stroke="#3D3870" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1318" y="480" font-size="18" font-weight="bold" fill="#3D3870">no</text>

  <!-- STEP 4 -->
  <rect x="1140" y="568" width="310" height="240" rx="16" fill="#FFFFFF" stroke="#C9C3EE" stroke-width="2"/>
  <rect x="1140" y="568" width="310" height="52" rx="16" fill="#3D3870"/>
  <rect x="1140" y="604" width="310" height="16" fill="#3D3870"/>
  <circle cx="1172" cy="594" r="17" fill="#FFFFFF"/>
  <text x="1172" y="601" text-anchor="middle" font-size="20" font-weight="bold" fill="#3D3870">4</text>
  <text x="1202" y="601" font-size="20" font-weight="bold" fill="#FFFFFF">ANCHOR-ITEM TEST</text>
  <text x="1164" y="656" font-size="19" fill="#2E2A55">Has a feature's relationship</text>
  <text x="1164" y="682" font-size="19" fill="#2E2A55">to prescribing itself changed?</text>
  <text x="1164" y="718" font-size="19" fill="#2E2A55">Change in item discrimination</text>
  <text x="1164" y="744" font-size="19" fill="#2E2A55">&gt; 45% against the reference</text>
  <text x="1164" y="770" font-size="19" fill="#2E2A55">population.</text>

  <!-- STEP 4 -> Retrain -->
  <line x1="1450" y1="688" x2="1512" y2="688" stroke="#3D3870" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1481" y="670" text-anchor="middle" font-size="18" font-weight="bold" fill="#3D3870">yes</text>
  <rect x="1520" y="640" width="230" height="96" rx="14" fill="#7F77DD"/>
  <text x="1635" y="680" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">RETRAIN</text>
  <text x="1635" y="708" text-anchor="middle" font-size="17" fill="#F0EEFC">same architecture and</text>
  <text x="1635" y="728" text-anchor="middle" font-size="17" fill="#F0EEFC">features, refit parameters</text>

  <!-- STEP 4 -> Recalibrate -->
  <line x1="1140" y1="688" x2="1078" y2="688" stroke="#3D3870" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1109" y="670" text-anchor="middle" font-size="18" font-weight="bold" fill="#3D3870">no</text>
  <rect x="840" y="640" width="230" height="96" rx="14" fill="#B5AFEB"/>
  <text x="955" y="680" text-anchor="middle" font-size="26" font-weight="bold" fill="#2E2A55">RECALIBRATE</text>
  <text x="955" y="708" text-anchor="middle" font-size="17" fill="#3D3870">remap probabilities;</text>
  <text x="955" y="728" text-anchor="middle" font-size="17" fill="#3D3870">ranking is left as it is</text>

  <!-- footnote panel -->
  <rect x="60" y="600" width="700" height="200" rx="16" fill="#F5F3FE" stroke="#C9C3EE" stroke-width="2"/>
  <text x="90" y="642" font-size="20" font-weight="bold" fill="#3D3870">READING THE ARCHITECTURE</text>
  <circle cx="100" cy="678" r="5" fill="#7F77DD"/>
  <text x="118" y="684" font-size="18" fill="#2E2A55">Verdicts are given per model, not per batch: one model can</text>
  <text x="118" y="708" font-size="18" fill="#2E2A55">need a rebuild while the others only need recalibration.</text>
  <circle cx="100" cy="738" r="5" fill="#7F77DD"/>
  <text x="118" y="744" font-size="18" fill="#2E2A55">Every threshold shown is illustrative, chosen to be legible for</text>
  <text x="118" y="768" font-size="18" fill="#2E2A55">this demonstration rather than validated against a decision.</text>

  <!-- bottom banner -->
  <rect x="60" y="852" width="1690" height="96" rx="16" fill="#3D3870"/>
  <text x="104" y="898" font-size="22" font-weight="bold" fill="#FFFFFF">THE POINT</text>
  <line x1="240" y1="872" x2="240" y2="928" stroke="#7F77DD" stroke-width="3"/>
  <text x="272" y="890" font-size="20" fill="#FFFFFF">A diagnostic earns its place only by changing a decision. Each gate above is included because it separates</text>
  <text x="272" y="918" font-size="20" fill="#FFFFFF">two responses that the gates before it cannot tell apart.</text>
</svg>
